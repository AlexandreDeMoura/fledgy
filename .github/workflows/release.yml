# Publishes the package to npm when a version tag is pushed, through npm's
# trusted publishing: no token, and provenance is added on its own.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24' # bundles npm 11, which trusted publishing needs
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: The tag matches the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm publish
