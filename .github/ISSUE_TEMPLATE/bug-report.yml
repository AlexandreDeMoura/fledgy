name: Bug report
description: Something in Fledgy did not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Fledgy did. Paste any error message as it appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The commands you ran or the skill you used, in order. Say if it happens every time.
  - type: dropdown
    id: install
    attributes:
      label: Install
      options:
        - Private (`npx fledgy init`)
        - Shared (`npx fledgy init --shared`)
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Fledgy, Node (`node --version`) and Claude Code (`claude --version`).
      placeholder: fledgy 0.1.0, Node 22.11.0, Claude Code 2.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1
    validations:
      required: true
